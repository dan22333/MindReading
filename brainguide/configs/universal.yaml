# Paper 1 — "The Wisdom of a Crowd of Brains: A Universal Brain Encoder".
# Uses the released WeizmannVision/brainit-fmri encoder (cloned into ../brainit-fmri).
# Weights: results/saved_models/encoder_ch128.pth  (python data/scripts/download/download_checkpoints.py)
device: auto
model_id: runwayml/stable-diffusion-v1-5

encoder:
  name: universal
  code_path: brainit-fmri                 # resolved relative to MindReading root
  checkpoint: brainit-fmri/results/saved_models/encoder_ch128.pth
  backbone: dinov2_vitl14_reg             # released model; in_channels inferred (1024)
  inner_ch: 128                           # encoder_ch128
  select_layers: [1, 6, 12, 18, 24]
  num_reg_tokens: 4
  include_reg_tokens: false
  backbone_image_size: 224
  # num_voxels: read from the checkpoint's voxel_embed (leave unset)

steer:
  # Target ROI = which voxel indices to drive. Placeholder range for now; replace
  # with a real ROI mask (download_roi_masks) -> voxel_ind list for a real region.
  voxels: {start: 0, stop: 500}
  # NOTE: the patched pipeline's cond_fn (grads=-grad(loss); eps=eps-sqrt(beta)*grads)
  # net-MINIMIZES the brain scalar, so sign=-1.0 is what MAXIMIZES ROI activation.
  # Verified via the 5x5 activation matrix (sign=+1 put the diagonal at the MINIMUM).
  sign: -1.0
  reduce: mean

generate:
  prompt: ""   # empty = BrainDiVE pure-discovery: no text prior, ONLY the brain gradient drives content
  num_inference_steps: 50
  guidance_scale: 7.5
  sag_scale: 0.0            # SAG off: incompatible with diffusers 0.27 add_noise; not needed for brain steering
  # Dimensionless strength with the ROI-independent gradient schedule (cond_fn):
  # guidance term = this fraction of the noise-prediction norm each step. One
  # value now works for ALL ROIs (old raw-grad meaning was ~100).
  clip_guidance_scale: 0.30   # swept faces 0.15/0.3/0.5/0.8: 0.3 = strongest still-coherent; 0.5 degrades, 0.8 re-explodes
  num_images_per_prompt: 1
  seed: 0

out_dir: outputs
