# TEST 2 — Time-travel / resampling (FreeDoM) on the universal (DINOv2) encoder.
# In the "semantic" window of sampling, redo each guided step `reps` times,
# re-noising x_{t-1} back up to level t between tries, so the diffusion prior
# re-absorbs the off-manifold (adversarial) part of the DINOv2 gradient.
# Requires a stateless Markovian step -> uses DDIM (not DPM-Solver).
#
# IMPORTANT for a fair read: DDIM != the DPM baseline, so the honest control is
# test2 with reps=1 (DDIM, no time-travel). run_tests.sh generates BOTH:
#   *_ctrl  = DDIM reps=1   (control)
#   *_tt    = DDIM reps=4   (time-travel)
# Compare tt vs ctrl to isolate the time-travel effect; compare ctrl vs baseline
# to see the scheduler swap.
device: auto
model_id: runwayml/stable-diffusion-v1-5

encoder:
  name: universal
  code_path: brainit-fmri
  checkpoint: brainit-fmri/results/saved_models/encoder_ch128.pth
  backbone: dinov2_vitl14_reg
  inner_ch: 128
  select_layers: [1, 6, 12, 18, 24]
  num_reg_tokens: 4
  include_reg_tokens: false
  backbone_image_size: 224

steer:
  voxels: {start: 0, stop: 500}
  sign: -1.0
  reduce: mean

# --- the test ---------------------------------------------------------------
timetravel:
  reps: 4          # redo each guided step this many times (1 = off/control)
  lo: 0.10         # window start as a fraction of total steps (skip early chaos)
  hi: 0.60         # window end (stop before late refinement)

generate:
  prompt: ""
  scheduler: ddim           # REQUIRED for time-travel (stateless step)
  num_inference_steps: 50
  guidance_scale: 7.5
  sag_scale: 0.0
  clip_guidance_scale: 0.30
  num_images_per_prompt: 1
  seed: 0

out_dir: experiments/test2_timetravel/outputs
